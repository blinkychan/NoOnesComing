<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No One's Coming!</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* ============================================================
   SETTINGS — edit these two lines
   ------------------------------------------------------------
   Video: put your file in this folder as video.mp4 (or change
   the src on the <video> tag below). Until it exists, visitors
   go straight to the script.
   ============================================================ */
:root {
  --space: #0c0809;
  --dust: #1a1112;
  --regolith: #c4572f;
  --regolith-hi: #e0754c;
  --ash: #e9ddd6;
  --haze: #9c8a84;
  --rule: #2c1f1f;
  --paper: #fbfaf7;
  --font-ui: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-script: "Courier Prime", "Courier New", Courier, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--space); color: var(--ash); }
body { font-family: var(--font-script); font-size: 15px; line-height: 1.5; }
body.gated { overflow: hidden; }
button, a.btn { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--regolith-hi); outline-offset: 3px; }
img { max-width: 100%; }

/* ---------- Video gate ---------- */
#gate {
  position: fixed; inset: 0; z-index: 20;
  display: grid; grid-template-rows: auto 1fr auto;
  background: radial-gradient(120% 70% at 50% 120%, rgba(196,87,47,.28), transparent 60%), var(--space);
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  transition: opacity .7s ease;
}
#gate.leaving { opacity: 0; pointer-events: none; }
.gate-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; max-width: 1200px; width: 100%; margin-inline: auto; }
.gate-logo { height: clamp(18px, 3.2vw, 28px); width: auto; opacity: .9; }
.eyebrow { font-family: var(--font-ui); text-transform: uppercase; letter-spacing: .16em; font-size: 13px; color: var(--haze); font-weight: 600; }
.stage { display: grid; place-items: center; min-height: 0; }
.frame {
  position: relative; width: min(100%, 1200px, calc((100dvh - 190px) * 16 / 9));
  aspect-ratio: 16 / 9; max-width: 100%;
  background: #000; border-radius: 4px; overflow: hidden;
  box-shadow: 0 30px 80px -30px rgba(196,87,47,.45), 0 0 0 1px var(--rule);
}
.frame video { width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
.overlay-btn { position: absolute; border: 0; cursor: pointer; font-family: var(--font-ui); font-weight: 600; text-transform: uppercase; letter-spacing: .12em; }
#soundChip {
  left: 50%; bottom: 18px; transform: translateX(-50%);
  background: var(--regolith); color: #fff; padding: 10px 18px 9px; border-radius: 999px; font-size: 15px;
  display: inline-flex; align-items: center; gap: 8px; animation: pulse 2.4s ease-in-out infinite;
}
#bigPlay { inset: 0; background: rgba(12,8,9,.55); color: var(--ash); display: grid; place-items: center; font-size: 18px; }
#bigPlay span { display: inline-flex; align-items: center; gap: 12px; padding: 16px 28px 15px; border: 1px solid var(--ash); border-radius: 999px; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(196,87,47,.55);} 50% { box-shadow: 0 0 0 10px rgba(196,87,47,0);} }
.gate-bottom { max-width: 1200px; width: 100%; margin-inline: auto; display: grid; gap: 12px; padding-top: 14px; }
.progress { height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; background: var(--regolith); transition: width .25s linear; }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ctl, a.btn.ctl {
  background: transparent; border: 1px solid var(--rule); border-radius: 999px;
  padding: 7px 14px 6px; cursor: pointer; font-family: var(--font-ui); font-weight: 600;
  text-transform: uppercase; letter-spacing: .1em; font-size: 14px; color: var(--ash);
  display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
}
.ctl:hover { border-color: var(--haze); }
.time { font-family: var(--font-ui); font-variant-numeric: tabular-nums; color: var(--haze); font-size: 15px; letter-spacing: .05em; }
.spacer { flex: 1; }
#skipBtn { border-color: transparent; color: var(--haze); }
#skipBtn:hover { color: var(--ash); border-color: var(--rule); }
.ico { width: 14px; height: 14px; fill: currentColor; flex: none; }

/* ---------- Script room ---------- */
.bar {
  position: sticky; top: 0; z-index: 10;
  padding-top: env(safe-area-inset-top, 0px);
  background: rgba(12,8,9,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule);
}
.bar-in { max-width: 1040px; margin-inline: auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.bar-logo { height: 18px; width: auto; }
.pageno { font-family: var(--font-ui); font-variant-numeric: tabular-nums; color: var(--haze); letter-spacing: .08em; font-size: 14px; white-space: nowrap; }
.btn-primary {
  background: var(--regolith); border: 0; color: #fff; border-radius: 999px;
  padding: 9px 16px 8px; cursor: pointer; font-family: var(--font-ui); font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em; font-size: 14px; text-decoration: none;
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
}
.btn-primary:hover { background: var(--regolith-hi); }
.room { padding-inline: 16px; padding-block: 0 calc(72px + env(safe-area-inset-bottom, 0px)); }
.lead { max-width: 820px; margin: 0 auto; padding-block: 64px 48px; text-align: center; display: grid; gap: 18px; justify-items: center; }
.lead img.logo { width: min(100%, 620px); height: auto; }
.lead .meta { color: var(--haze); }
.lead .meta b { color: var(--ash); font-weight: 400; }
.facts { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; font-family: var(--font-ui); text-transform: uppercase; letter-spacing: .14em; font-size: 13px; color: var(--haze); font-weight: 600; }
.facts span { display: inline-flex; gap: 6px; }
.facts em { font-style: normal; color: var(--ash); font-variant-numeric: tabular-nums; }
.pages { max-width: 860px; margin-inline: auto; display: grid; gap: 22px; }
.page {
  margin: 0; background: var(--paper); border-radius: 2px; overflow: hidden;
  box-shadow: 0 22px 50px -24px rgba(0,0,0,.9);
  aspect-ratio: 8.5 / 11; position: relative;
}
.page canvas { display: block; width: 100%; height: 100%; }
.page .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #b9b2ad; font-size: 13px; }
.fallback { max-width: 860px; margin-inline: auto; text-align: center; color: var(--haze); display: grid; gap: 16px; justify-items: center; }
.fallback iframe { width: 100%; height: 80vh; border: 0; background: var(--paper); border-radius: 2px; }
.end { text-align: center; margin-top: 48px; color: var(--haze); font-family: var(--font-ui); letter-spacing: .14em; text-transform: uppercase; font-size: 13px; display: grid; gap: 14px; justify-items: center; }

@media (max-width: 560px) {
  .bar-logo { display: none; }
  .lead { padding-block: 40px 32px; }
  .pages { gap: 12px; }
  .controls .ctl .lbl { display: none; }
  #skipBtn .lbl { display: inline; }
}
@media (prefers-reduced-motion: reduce) {
  #gate, .progress i { transition: none; }
  #soundChip { animation: none; }
}
</style>
</head>
<body>

<section id="gate" aria-label="Pitch video" hidden>
  <div class="gate-top">
    <img class="gate-logo" src="logo.png" alt="No One's Coming!">
    <span class="eyebrow">Pilot · Cerone &amp; Woodruff</span>
  </div>
  <div class="stage">
    <div class="frame">
      <video id="vid" src="video.mp4" playsinline muted preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback"></video>
      <button id="soundChip" class="overlay-btn" type="button" hidden>
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
        Tap for sound
      </button>
      <button id="bigPlay" class="overlay-btn" type="button" hidden>
        <span><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2l10 6-10 6z"/></svg>Play the pitch</span>
      </button>
    </div>
  </div>
  <div class="gate-bottom">
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    <div class="controls">
      <button id="playBtn" class="ctl" type="button" aria-label="Pause">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path id="playIco" d="M4 2h3v12H4zM9 2h3v12H9z"/></svg><span class="lbl" id="playLbl">Pause</span>
      </button>
      <button id="muteBtn" class="ctl" type="button"><span class="lbl" id="muteLbl">Sound on</span></button>
      <span class="time" id="time">0:00 / 0:00</span>
      <span class="spacer"></span>
      <button id="skipBtn" class="ctl" type="button"><span class="lbl">Skip to script</span>
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3l7 5-7 5zM9 3l5 5-5 5z"/></svg>
      </button>
    </div>
  </div>
</section>

<div id="room" hidden>
  <header class="bar">
    <div class="bar-in">
      <img class="bar-logo" src="logo.png" alt="">
      <span class="pageno" id="pageno">Title page</span>
      <span class="spacer"></span>
      <button class="ctl rewatch" type="button" hidden>
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2l10 6-10 6z"/></svg><span class="lbl">Video</span>
      </button>
      <a class="btn-primary" href="script.pdf" download="No One's Coming - Pilot (10.7.25).pdf">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 1h2v8l3-3 1.4 1.4L8 12.8 2.6 7.4 4 6l3 3z"/><path d="M2 13h12v2H2z"/></svg>PDF
      </a>
    </div>
  </header>

  <main class="room">
    <div class="lead">
      <span class="eyebrow">&ldquo;Pilot&rdquo;</span>
      <img class="logo" src="logo.png" alt="No One's Coming!">
      <div class="meta">Written by <b>Daniel Cerone &amp; Ken Woodruff</b></div>
      <div class="facts" aria-label="Script details">
        <span>Draft <em>10.7.25</em></span>
        <span>Pages <em>58</em></span>
        <span>Setting <em>Mars Colony</em></span>
      </div>
      <a class="btn-primary" href="script.pdf" download="No One's Coming - Pilot (10.7.25).pdf">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 1h2v8l3-3 1.4 1.4L8 12.8 2.6 7.4 4 6l3 3z"/><path d="M2 13h12v2H2z"/></svg>Download script (PDF)
      </a>
    </div>

    <div class="pages" id="pages" aria-label="Script"></div>

    <div class="fallback" id="fallback" hidden>
      <p>Your browser couldn't display the script inline.</p>
      <iframe src="script.pdf" title="No One's Coming! script"></iframe>
      <a class="btn-primary" href="script.pdf" target="_blank" rel="noopener">Open the PDF</a>
    </div>

    <div class="end">
      The End
      <button class="ctl rewatch" type="button" hidden>Watch the pitch again</button>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  var PDF_URL = "script.pdf";
  var SEEN_KEY = "noc-pitch-seen";

  var gate = document.getElementById("gate");
  var room = document.getElementById("room");
  var vid = document.getElementById("vid");
  var bar = document.getElementById("bar");
  var time = document.getElementById("time");
  var soundChip = document.getElementById("soundChip");
  var bigPlay = document.getElementById("bigPlay");
  var playBtn = document.getElementById("playBtn");
  var playIco = document.getElementById("playIco");
  var playLbl = document.getElementById("playLbl");
  var muteLbl = document.getElementById("muteLbl");
  var rewatch = document.querySelectorAll(".rewatch");
  var PAUSE_D = "M4 2h3v12H4zM9 2h3v12H9z", PLAY_D = "M4 2l10 6-10 6z";
  var hasVideo = false;

  function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function markSeen() { try { localStorage.setItem(SEEN_KEY, "1"); } catch (e) {} }
  function seen() { try { return localStorage.getItem(SEEN_KEY) === "1"; } catch (e) { return false; } }

  /* ---------------- Video gate ---------------- */
  function syncPlay() {
    var p = vid.paused;
    playIco.setAttribute("d", p ? PLAY_D : PAUSE_D);
    playLbl.textContent = p ? "Play" : "Pause";
    playBtn.setAttribute("aria-label", p ? "Play" : "Pause");
  }
  function syncMute() {
    muteLbl.textContent = vid.muted ? "Sound on" : "Mute";
    soundChip.hidden = !vid.muted || vid.paused;
  }
  function tryPlay() {
    var p = vid.play();
    if (p && p.catch) p.catch(function () { bigPlay.hidden = false; soundChip.hidden = true; });
  }
  vid.addEventListener("play", function () { bigPlay.hidden = true; syncPlay(); syncMute(); });
  vid.addEventListener("pause", function () { syncPlay(); syncMute(); });
  vid.addEventListener("volumechange", syncMute);
  vid.addEventListener("timeupdate", function () {
    if (vid.duration) bar.style.width = (vid.currentTime / vid.duration * 100) + "%";
    time.textContent = fmt(vid.currentTime) + " / " + fmt(vid.duration);
  });
  vid.addEventListener("ended", function () { openRoom(); });

  soundChip.addEventListener("click", function () { vid.muted = false; vid.volume = 1; if (vid.paused) tryPlay(); });
  bigPlay.addEventListener("click", function () { vid.muted = false; tryPlay(); });
  playBtn.addEventListener("click", function () { vid.paused ? tryPlay() : vid.pause(); });
  document.getElementById("muteBtn").addEventListener("click", function () { vid.muted = !vid.muted; if (!vid.muted && vid.paused) tryPlay(); });
  document.getElementById("skipBtn").addEventListener("click", function () { openRoom(); });

  function openRoom(instant) {
    markSeen();
    vid.pause();
    room.hidden = false;
    document.body.classList.remove("gated");
    window.scrollTo(0, 0);
    if (instant) { gate.hidden = true; return; }
    gate.classList.add("leaving");
    setTimeout(function () { gate.hidden = true; gate.classList.remove("leaving"); }, 720);
  }
  function openGate() {
    gate.hidden = false;
    document.body.classList.add("gated");
    vid.currentTime = 0;
    vid.muted = false;
    tryPlay();
  }
  rewatch.forEach(function (b) { b.addEventListener("click", openGate); });

  // Decide what a visitor sees first. If there's no video file yet, go straight to the script.
  var decided = false;
  function decide(videoOk) {
    if (decided) return; decided = true;
    hasVideo = videoOk;
    rewatch.forEach(function (b) { b.hidden = !videoOk; });
    if (videoOk && !seen()) {
      gate.hidden = false;
      document.body.classList.add("gated");
      tryPlay();
      syncMute();
    } else {
      room.hidden = false;
    }
  }
  vid.addEventListener("loadedmetadata", function () { time.textContent = "0:00 / " + fmt(vid.duration); decide(true); });
  vid.addEventListener("error", function () { decide(false); });
  setTimeout(function () { decide(vid.readyState >= 1); }, 4000);

  /* ---------------- Script (rendered from the original PDF) ---------------- */
  var pagesEl = document.getElementById("pages");
  var pageno = document.getElementById("pageno");
  function fallback() { pagesEl.hidden = true; document.getElementById("fallback").hidden = false; }
  if (!window.pdfjsLib) { fallback(); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  pdfjsLib.getDocument(PDF_URL).promise.then(function (pdf) {
    var total = pdf.numPages;
    var figs = [];
    for (var i = 1; i <= total; i++) {
      var fig = document.createElement("figure");
      fig.className = "page"; fig.dataset.n = i;
      fig.setAttribute("aria-label", i === 1 ? "Title page" : "Page " + (i - 1));
      fig.innerHTML = '<div class="loading">Page ' + (i === 1 ? "—" : i - 1) + "</div>";
      pagesEl.appendChild(fig); figs.push(fig);
    }

    function render(fig) {
      if (fig.dataset.done) return; fig.dataset.done = "1";
      pdf.getPage(+fig.dataset.n).then(function (page) {
        var base = page.getViewport({ scale: 1 });
        fig.style.aspectRatio = base.width + " / " + base.height;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var scale = (fig.clientWidth * dpr) / base.width;
        var vp = page.getViewport({ scale: scale });
        var c = document.createElement("canvas");
        c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
        return page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise.then(function () {
          fig.innerHTML = ""; fig.appendChild(c);
        });
      }).catch(function () { delete fig.dataset.done; });
    }

    if ("IntersectionObserver" in window) {
      var lazy = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) { render(e.target); lazy.unobserve(e.target); } });
      }, { rootMargin: "1200px 0px" });
      var counter = new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (!e.isIntersecting) return;
          var n = +e.target.dataset.n;
          pageno.textContent = n === 1 ? "Title page" : "p. " + (n - 1) + " / " + (total - 1);
        });
      }, { rootMargin: "-45% 0px -50% 0px" });
      figs.forEach(function (f) { lazy.observe(f); counter.observe(f); });
    } else {
      figs.forEach(render);
    }
  }).catch(fallback);
})();
</script>
</body>
</html>
