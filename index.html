<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No One's Coming!</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap">
<style>
/* Layout: Mars Settlement Initiative stationery. Step 1 is the video, framed like a technical
   drawing. Step 2 is the script on a single centered column with one dominant download action.
   A two-step rail in the header carries the sequence; no instructional copy. Single light look. */
:root {
  --paper: #efebe3;
  --ink: #1b2438;
  --ink-soft: #4b5468;
  --hair: #b9b2a6;
  --mars: #c4552f;
  --mars-hi: #d76a43;
  --mars-deep: #a8441f;
  --sheet: #fdfcf9;
  --font-caps: "Jost", "Futura", "Avenir Next", "Century Gothic", sans-serif;
  --font-body: "Libre Baskerville", "Baskerville", Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body {
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  background-image: radial-gradient(rgba(27,36,56,.035) 1px, transparent 1px);
  background-size: 3px 3px;
}
body.gated { overflow: hidden; }
img { max-width: 100%; }
button, a { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--mars); outline-offset: 3px; }
.caps { font-family: var(--font-caps); text-transform: uppercase; letter-spacing: .22em; font-size: 12px; line-height: 1.75; font-weight: 400; }
.ico { width: 12px; height: 12px; fill: currentColor; flex: none; }

.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand .mark { width: 46px; height: auto; flex: none; }
.brand .logo { height: 20px; width: auto; min-width: 0; }

/* ---------- Two-step rail ---------- */
.steps { display: flex; align-items: center; gap: 12px; }
.step { display: inline-flex; align-items: center; gap: 9px; background: none; border: 0; padding: 4px 0; color: var(--ink-soft); }
.step .dot {
  width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--hair);
  display: grid; place-items: center; font-family: var(--font-caps); font-size: 11px; letter-spacing: 0; color: var(--ink-soft);
}
.step .dot svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2; }
.step.active { color: var(--ink); }
.step.active .dot { background: var(--mars); border-color: var(--mars); color: #fff; }
.step.done .dot { background: var(--ink); border-color: var(--ink); color: var(--paper); }
button.step { cursor: pointer; font: inherit; text-transform: inherit; letter-spacing: inherit; }
button.step:hover { color: var(--mars); }
.steps .line { width: 44px; height: 1px; background: var(--hair); }
.steps .line.done { background: var(--ink); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 10px; cursor: pointer; text-decoration: none;
  font-family: var(--font-caps); text-transform: uppercase; letter-spacing: .2em; font-size: 12px; font-weight: 500;
  padding: 10px 6px 9px; border: 0; background: transparent; color: var(--ink);
}
.btn:hover { color: var(--mars); }
.dl {
  display: inline-flex; align-items: center; justify-content: center; gap: 12px; text-decoration: none; cursor: pointer;
  background: var(--mars); color: #fff; border: 0;
  font-family: var(--font-caps); font-weight: 600; text-transform: uppercase; letter-spacing: .2em;
  font-size: 13px; padding: 12px 20px 11px; white-space: nowrap;
  box-shadow: 0 1px 0 var(--mars-deep);
  transition: background .15s, transform .15s;
}
.dl:hover { background: var(--mars-hi); }
.dl:active { transform: translateY(1px); }
.dl svg { width: 14px; height: 14px; fill: currentColor; flex: none; }
.dl .done-ico { display: none; }
.dl.downloaded .dl-ico { display: none; }
.dl.downloaded .done-ico { display: block; }

/* ================= Step 1: video ================= */
#gate {
  position: fixed; inset: 0; z-index: 20; background-color: var(--paper);
  display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
  transition: opacity .7s ease;
}
#gate.leaving { opacity: 0; pointer-events: none; }
.gate-head { max-width: 1060px; width: 100%; margin-inline: auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.stage { display: grid; place-items: center; min-height: 0; padding-block: 22px 10px; }
.drawing { position: relative; width: min(100%, 1060px, calc((100dvh - 230px) * 16 / 9)); max-width: 100%; }
.drawing::before, .drawing::after { content: ""; position: absolute; pointer-events: none; }
.drawing::before { left: -18px; right: -18px; top: 0; bottom: 0; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.drawing::after { top: -18px; bottom: -18px; left: 0; right: 0; border-left: 1px solid var(--hair); border-right: 1px solid var(--hair); }
.frame { position: relative; aspect-ratio: 16 / 9; width: 100%; background: #0e121b; overflow: hidden; z-index: 1; }
.frame video { width: 100%; height: 100%; display: block; object-fit: contain; background: #0e121b; cursor: pointer; }
.overlay { position: absolute; border: 0; cursor: pointer; font-family: var(--font-caps); text-transform: uppercase; letter-spacing: .2em; font-weight: 500; }
#soundChip {
  left: 50%; bottom: 20px; transform: translateX(-50%); white-space: nowrap;
  background: var(--paper); color: var(--ink); padding: 11px 18px 10px; font-size: 12px;
  display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
#soundChip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mars); animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
#bigPlay { inset: 0; background: rgba(14,18,27,.45); display: grid; place-items: center; }
#bigPlay span { width: 84px; height: 84px; border-radius: 50%; background: var(--mars); display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
#bigPlay svg { width: 26px; height: 26px; fill: #fff; margin-left: 4px; }

.gate-foot { max-width: 1060px; width: 100%; margin-inline: auto; display: grid; gap: 10px; padding-top: 14px; }
.progress { position: relative; height: 22px; cursor: pointer; touch-action: none; }
.progress::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--hair); }
.progress i { position: absolute; left: 0; top: calc(50% - 1px); height: 3px; width: 0; background: var(--mars); pointer-events: none; }
.progress b { position: absolute; top: 50%; left: 0; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%; background: var(--paper); border: 2px solid var(--mars); pointer-events: none; transition: transform .15s; }
.progress:hover b, .progress.dragging b { transform: scale(1.25); }
.progress .tip { position: absolute; bottom: 100%; transform: translateX(-50%); font-family: var(--font-caps); font-size: 11px; letter-spacing: .1em; font-variant-numeric: tabular-nums; background: var(--paper); border: 1px solid var(--hair); padding: 2px 6px; pointer-events: none; white-space: nowrap; }
.controls { display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; }
.time { font-family: var(--font-caps); font-variant-numeric: tabular-nums; letter-spacing: .14em; font-size: 12px; color: var(--ink-soft); }
.spacer { flex: 1; }
#skipBtn { color: var(--ink-soft); font-size: 11px; }
#skipBtn:hover { color: var(--ink); }

/* ================= Step 2: script ================= */
.bar {
  position: sticky; top: 0; z-index: 10;
  padding-top: env(safe-area-inset-top, 0px);
  background: rgba(239,235,227,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--hair);
}
.bar-in { max-width: 1060px; margin-inline: auto; padding: 10px 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
.bar-in .dl { justify-self: end; }

.room { padding-inline: 16px; padding-block: 40px 0; }
.col { max-width: 820px; margin-inline: auto; }
.hero-dl {
  width: 100%; font-size: clamp(15px, 2.2vw, 19px); letter-spacing: .24em; padding: 26px 24px 24px; gap: 16px;
}
.hero-dl svg { width: 20px; height: 20px; }
.hero-dl.arrive { animation: arrive 1.4s cubic-bezier(.2,.7,.2,1) 1; }
@keyframes arrive {
  0% { transform: translateY(14px); opacity: 0; box-shadow: 0 0 0 0 rgba(196,85,47,.6); }
  40% { transform: none; opacity: 1; }
  100% { box-shadow: 0 0 0 22px rgba(196,85,47,0); }
}
.pages { display: grid; gap: 22px; margin-top: 28px; }
.page { margin: 0; background: var(--sheet); position: relative; aspect-ratio: 8.5 / 11; overflow: hidden; box-shadow: 0 1px 0 var(--hair), 0 18px 40px -26px rgba(27,36,56,.45); }
.page canvas { display: block; width: 100%; height: 100%; }
.page .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--hair); }
.fallback { margin-top: 28px; }
.fallback iframe { width: 100%; height: 80vh; border: 1px solid var(--hair); background: var(--sheet); display: block; }
.end-dl { margin-top: 36px; }

.horizon { position: relative; height: 130px; margin-top: 80px; overflow: hidden; border-bottom: 1px solid rgba(27,36,56,.45); }
.horizon::before, .horizon::after { content: ""; position: absolute; border-radius: 50%; }
.horizon::before { width: 140vw; height: 140vw; left: -62vw; top: 40px; background: radial-gradient(circle at 60% 8%, #6f95b8 0, #3b6894 18%, #24496f 40%); opacity: .85; }
.horizon::after { width: 130vw; height: 130vw; right: -55vw; top: 22px; mix-blend-mode: multiply; background: radial-gradient(circle at 40% 6%, #e48a62 0, #c9532f 20%, #a63f22 42%); opacity: .9; }
.foot { max-width: 1060px; margin-inline: auto; padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 24px); display: flex; justify-content: center; }
.foot img { height: 16px; width: auto; opacity: .7; }

/* Phone: download moves to a full-width bar at the bottom, in thumb reach */
.dock { display: none; }
@media (max-width: 700px) {
  .bar-in { grid-template-columns: 1fr auto; }
  .bar-in .dl { display: none; }
  .brand .logo { height: 16px; }
  .brand .mark { width: 36px; }
  .steps .label { display: none; }
  .steps .line { width: 22px; }
  .room { padding-block: 24px 0; }
  .pages { gap: 12px; }
  .dock {
    display: block; position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 10px);
    background: rgba(239,235,227,.96); border-top: 1px solid var(--hair);
    transform: translateY(110%); transition: transform .25s ease;
  }
  .dock.show { transform: none; }
  .dock .dl { width: 100%; padding-block: 16px 15px; font-size: 14px; }
  .foot { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); }
  .hero-dl { padding-block: 20px 19px; }
}
@media (max-width: 600px) {
  .gate-head .brand .logo { display: none; }
  #playLbl, .seek .lbl { display: none; }
  .drawing::before { left: -8px; right: -8px; }
  #soundChip { bottom: 12px; padding: 9px 14px 8px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  #gate, .progress b, .dl { transition: none; }
  #soundChip::before, .hero-dl.arrive { animation: none; }
}
</style>
</head>
<body>

<!-- ================= Step 1: video ================= -->
<section id="gate" aria-label="Video" hidden>
  <div class="gate-head">
    <div class="brand">
      <img class="mark" src="mark.svg" width="184" height="128" alt="">
      <img class="logo" src="logo.png" alt="No One's Coming!">
    </div>
    <div class="steps caps" aria-label="Step 1 of 2">
      <span class="step active"><span class="dot">1</span><span class="label">Video</span></span>
      <span class="line"></span>
      <span class="step"><span class="dot">2</span><span class="label">Script</span></span>
    </div>
  </div>

  <div class="stage">
    <div class="drawing">
      <div class="frame">
        <video id="vid" src="video.mp4" playsinline muted preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback"></video>
        <button id="soundChip" class="overlay" type="button" hidden>Tap for sound</button>
        <button id="bigPlay" class="overlay" type="button" aria-label="Play video" hidden>
          <span><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5l11 6.5-11 6.5z"/></svg></span>
        </button>
      </div>
    </div>
  </div>

  <div class="gate-foot">
    <div class="progress" id="scrub" role="slider" tabindex="0" aria-label="Video position" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00"><i id="bar"></i><b id="knob"></b><span class="tip" id="tip" hidden>0:00</span></div>
    <div class="controls">
      <button id="playBtn" class="btn" type="button" aria-label="Pause">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path id="playIco" d="M4 2h3v12H4zM9 2h3v12H9z"/></svg><span id="playLbl">Pause</span>
      </button>
      <button id="backBtn" class="btn seek" type="button" aria-label="Back 10 seconds">
        <svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3L1 8l7 5zM15 3L8 8l7 5z"/></svg><span class="lbl">10s</span>
      </button>
      <button id="fwdBtn" class="btn seek" type="button" aria-label="Forward 10 seconds">
        <span class="lbl">10s</span><svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3l7 5-7 5zM1 3l7 5-7 5z"/></svg>
      </button>
      <button id="muteBtn" class="btn" type="button"><span id="muteLbl">Sound on</span></button>
      <span class="time" id="time">0:00 / 0:00</span>
      <span class="spacer"></span>
      <button id="skipBtn" class="btn" type="button">Skip</button>
    </div>
  </div>
</section>

<!-- ================= Step 2: script ================= -->
<div id="room" hidden>
  <header class="bar">
    <div class="bar-in">
      <div class="brand">
        <img class="mark" src="mark.svg" width="184" height="128" alt="">
        <img class="logo" src="logo.png" alt="No One's Coming!">
      </div>
      <div class="steps caps" aria-label="Step 2 of 2">
        <button class="step done" id="stepVideo" type="button" aria-label="Replay video">
          <span class="dot"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5l2.5 2.5L10 3.5"/></svg></span><span class="label">Video</span>
        </button>
        <span class="line done"></span>
        <span class="step active"><span class="dot">2</span><span class="label">Script</span></span>
      </div>
      <a class="dl" data-where="top bar" href="script.pdf" download="No One's Coming - Pilot.pdf">
        <svg class="dl-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 1h2v8l3-3 1.4 1.4L8 12.8 2.6 7.4 4 6l3 3z"/><path d="M2 13h12v2H2z"/></svg>
        <svg class="done-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 11.6L2.4 7.8l1.4-1.4 2.4 2.4 6-6 1.4 1.4z"/><path d="M2 13h12v2H2z"/></svg>
        <span class="dl-lbl">Download</span>
      </a>
    </div>
  </header>

  <main class="room">
    <div class="col">
      <a class="dl hero-dl" id="heroDl" data-where="above script" href="script.pdf" download="No One's Coming - Pilot.pdf">
        <svg class="dl-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 1h2v8l3-3 1.4 1.4L8 12.8 2.6 7.4 4 6l3 3z"/><path d="M2 13h12v2H2z"/></svg>
        <svg class="done-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 11.6L2.4 7.8l1.4-1.4 2.4 2.4 6-6 1.4 1.4z"/><path d="M2 13h12v2H2z"/></svg>
        <span class="dl-lbl">Download the script</span>
      </a>

      <div class="pages" id="pages" aria-label="Script"></div>

      <div class="fallback" id="fallback" hidden>
        <iframe src="script.pdf" title="No One's Coming! script"></iframe>
      </div>

      <a class="dl hero-dl end-dl" data-where="end of script" href="script.pdf" download="No One's Coming - Pilot.pdf">
        <svg class="dl-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 1h2v8l3-3 1.4 1.4L8 12.8 2.6 7.4 4 6l3 3z"/><path d="M2 13h12v2H2z"/></svg>
        <svg class="done-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 11.6L2.4 7.8l1.4-1.4 2.4 2.4 6-6 1.4 1.4z"/><path d="M2 13h12v2H2z"/></svg>
        <span class="dl-lbl">Download the script</span>
      </a>
    </div>
  </main>

  <div class="horizon" aria-hidden="true"></div>
  <footer class="foot"><img src="logo.png" alt=""></footer>

  <div class="dock">
    <a class="dl" data-where="phone bar" href="script.pdf" download="No One's Coming - Pilot.pdf">
      <svg class="dl-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 1h2v8l3-3 1.4 1.4L8 12.8 2.6 7.4 4 6l3 3z"/><path d="M2 13h12v2H2z"/></svg>
      <svg class="done-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 11.6L2.4 7.8l1.4-1.4 2.4 2.4 6-6 1.4 1.4z"/><path d="M2 13h12v2H2z"/></svg>
      <span class="dl-lbl">Download the script</span>
    </a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* =====================================================================
   TRACKING — paste your Google Apps Script web app URL between the quotes.
   Leave it empty and the page works the same, it just doesn't log.
   ===================================================================== */
var LOG_URL = "";

(function () {
  var PDF_URL = "script.pdf";
  var SEEN_KEY = "noc-pitch-seen";

  /* ---------------- Logging ---------------- */
  function getStore(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function setStore(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var params = new URLSearchParams(location.search);
  var recipient = (params.get("r") || "").trim().slice(0, 80);
  if (recipient) setStore("noc-r", recipient); else recipient = getStore("noc-r") || "";
  var visit = Math.random().toString(36).slice(2, 8);

  function track(event, detail, useBeacon) {
    if (!LOG_URL) return;
    var body = JSON.stringify({
      recipient: recipient, event: event, detail: detail || "", visit: visit,
      ua: navigator.userAgent, screen: screen.width + "x" + screen.height, referrer: document.referrer || ""
    });
    try {
      if (useBeacon && navigator.sendBeacon && navigator.sendBeacon(LOG_URL, new Blob([body], { type: "text/plain" }))) return;
      fetch(LOG_URL, { method: "POST", mode: "no-cors", keepalive: true, headers: { "Content-Type": "text/plain" }, body: body });
    } catch (e) {}
  }

  /* ---------------- Elements ---------------- */
  var gate = document.getElementById("gate");
  var room = document.getElementById("room");
  var vid = document.getElementById("vid");
  var bar = document.getElementById("bar");
  var time = document.getElementById("time");
  var soundChip = document.getElementById("soundChip");
  var bigPlay = document.getElementById("bigPlay");
  var playBtn = document.getElementById("playBtn");
  var playIco = document.getElementById("playIco");
  var playLbl = document.getElementById("playLbl");
  var muteLbl = document.getElementById("muteLbl");
  var heroDl = document.getElementById("heroDl");
  var stepVideo = document.getElementById("stepVideo");
  var PAUSE_D = "M4 2h3v12H4zM9 2h3v12H9z", PLAY_D = "M4 2l10 6-10 6z";
  function fmt(s) { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

  /* ---------------- Video ---------------- */
  var started = false, maxWatched = 0;
  function syncPlay() {
    var p = vid.paused;
    playIco.setAttribute("d", p ? PLAY_D : PAUSE_D);
    playLbl.textContent = p ? "Play" : "Pause";
    playBtn.setAttribute("aria-label", p ? "Play" : "Pause");
  }
  function syncMute() {
    muteLbl.textContent = vid.muted ? "Sound on" : "Mute";
    soundChip.hidden = !vid.muted || vid.paused;
  }
  function tryPlay() {
    var p = vid.play();
    if (p && p.catch) p.catch(function () { bigPlay.hidden = false; soundChip.hidden = true; });
  }
  vid.addEventListener("play", function () {
    bigPlay.hidden = true; syncPlay(); syncMute();
    if (!started) { started = true; track("Started video"); }
  });
  vid.addEventListener("pause", function () { syncPlay(); syncMute(); });
  vid.addEventListener("volumechange", function () {
    syncMute();
    if (!vid.muted && !vid._soundLogged) { vid._soundLogged = true; track("Turned sound on"); }
  });
  vid.addEventListener("click", function () { if (vid.muted) { vid.muted = false; vid.volume = 1; } else if (vid.paused) tryPlay(); else vid.pause(); });

  var scrub = document.getElementById("scrub"), knob = document.getElementById("knob"), tip = document.getElementById("tip");
  var dragging = false;
  function paint(t) {
    var d = vid.duration || 0, pct = d ? Math.min(100, Math.max(0, t / d * 100)) : 0;
    bar.style.width = pct + "%"; knob.style.left = pct + "%";
    time.textContent = fmt(t) + " / " + fmt(d);
    scrub.setAttribute("aria-valuemax", Math.floor(d));
    scrub.setAttribute("aria-valuenow", Math.floor(t));
    scrub.setAttribute("aria-valuetext", fmt(t) + " of " + fmt(d));
  }
  function timeAt(x) { var r = scrub.getBoundingClientRect(); return Math.min(1, Math.max(0, (x - r.left) / r.width)) * (vid.duration || 0); }
  function seek(t) { if (!vid.duration) return; t = Math.min(Math.max(0, t), Math.max(0, vid.duration - 0.05)); vid.currentTime = t; paint(t); }
  vid.addEventListener("timeupdate", function () {
    if (!vid.paused && !vid.seeking) maxWatched = Math.max(maxWatched, vid.currentTime);
    if (!dragging) paint(vid.currentTime);
  });
  scrub.addEventListener("pointerdown", function (e) {
    if (!vid.duration) return;
    dragging = true; scrub.classList.add("dragging");
    try { scrub.setPointerCapture(e.pointerId); } catch (x) {}
    seek(timeAt(e.clientX));
  });
  scrub.addEventListener("pointermove", function (e) {
    if (!vid.duration) return;
    var t = timeAt(e.clientX), r = scrub.getBoundingClientRect();
    tip.hidden = false; tip.textContent = fmt(t); tip.style.left = (e.clientX - r.left) + "px";
    if (dragging) seek(t);
  });
  function endDrag() { dragging = false; scrub.classList.remove("dragging"); }
  scrub.addEventListener("pointerup", endDrag);
  scrub.addEventListener("pointercancel", endDrag);
  scrub.addEventListener("pointerleave", function () { if (!dragging) tip.hidden = true; });
  scrub.addEventListener("keydown", function (e) {
    var step = { ArrowLeft: -5, ArrowRight: 5, ArrowDown: -5, ArrowUp: 5, PageDown: -30, PageUp: 30 }[e.key];
    if (e.key === "Home") { e.preventDefault(); seek(0); }
    else if (e.key === "End") { e.preventDefault(); seek(vid.duration); }
    else if (step) { e.preventDefault(); seek(vid.currentTime + step); }
  });
  document.getElementById("backBtn").addEventListener("click", function () { seek(vid.currentTime - 10); });
  document.getElementById("fwdBtn").addEventListener("click", function () { seek(vid.currentTime + 10); });

  soundChip.addEventListener("click", function () { vid.muted = false; vid.volume = 1; if (vid.paused) tryPlay(); });
  bigPlay.addEventListener("click", function () { vid.muted = false; tryPlay(); });
  playBtn.addEventListener("click", function () { vid.paused ? tryPlay() : vid.pause(); });
  document.getElementById("muteBtn").addEventListener("click", function () { vid.muted = !vid.muted; if (!vid.muted && vid.paused) tryPlay(); });

  vid.addEventListener("ended", function () {
    if (dragging) return;
    track("Finished video", "watched " + fmt(maxWatched) + " of " + fmt(vid.duration));
    openRoom();
  });
  document.getElementById("skipBtn").addEventListener("click", function () {
    track("Skipped video", "at " + fmt(vid.currentTime) + " of " + fmt(vid.duration) + ", furthest " + fmt(maxWatched));
    openRoom();
  });

  function openRoom() {
    setStore(SEEN_KEY, "1");
    vid.pause();
    room.hidden = false;
    document.body.classList.remove("gated");
    window.scrollTo(0, 0);
    track("Opened script");
    heroDl.classList.remove("arrive"); void heroDl.offsetWidth; heroDl.classList.add("arrive");
    gate.classList.add("leaving");
    setTimeout(function () { gate.hidden = true; gate.classList.remove("leaving"); }, 720);
  }
  function openGate() {
    gate.hidden = false;
    document.body.classList.add("gated");
    vid.currentTime = 0; maxWatched = 0; started = false;
    vid.muted = false;
    tryPlay();
  }
  stepVideo.addEventListener("click", function () { track("Replayed video"); openGate(); });

  // First view: the video if the file exists and this browser hasn't seen it; otherwise the script.
  var decided = false;
  function decide(videoOk) {
    if (decided) return; decided = true;
    var returning = getStore(SEEN_KEY) === "1";
    track(returning ? "Came back" : "Opened page", videoOk ? "" : "no video file on site");
    if (!videoOk) { stepVideo.hidden = true; stepVideo.nextElementSibling.hidden = true; }
    if (videoOk && !returning) {
      gate.hidden = false;
      document.body.classList.add("gated");
      tryPlay(); syncMute();
    } else {
      room.hidden = false;
    }
  }
  vid.addEventListener("loadedmetadata", function () { paint(0); decide(true); });
  vid.addEventListener("error", function () { decide(false); });
  if (vid.readyState >= 1) { paint(vid.currentTime); decide(true); }
  else if (vid.error) decide(false);
  setTimeout(function () { decide(vid.readyState >= 1); }, 4000);

  /* Phone: the bottom download bar slides in once the big button scrolls away */
  var dock = document.querySelector(".dock");
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (es) {
      es.forEach(function (e) { dock.classList.toggle("show", !e.isIntersecting && e.boundingClientRect.top < 0); });
    }).observe(heroDl);
  } else { dock.classList.add("show"); }

  /* ---------------- Download ---------------- */
  var downloads = 0;
  document.querySelectorAll(".dl").forEach(function (a) {
    a.addEventListener("click", function () {
      downloads++;
      track("Downloaded script", a.dataset.where + (downloads > 1 ? " (again)" : ""));
      document.querySelectorAll(".dl").forEach(function (b) {
        b.classList.add("downloaded");
        var l = b.querySelector(".dl-lbl");
        if (l && !l.dataset.orig) l.dataset.orig = l.textContent;
        if (l) l.textContent = "Downloaded";
      });
      setTimeout(function () {
        document.querySelectorAll(".dl").forEach(function (b) {
          b.classList.remove("downloaded");
          var l = b.querySelector(".dl-lbl"); if (l && l.dataset.orig) l.textContent = l.dataset.orig;
        });
      }, 4000);
    });
  });

  /* ---------------- Script, rendered from the original PDF ---------------- */
  var pagesEl = document.getElementById("pages");
  var furthest = 0, totalPages = 0;
  window.addEventListener("pagehide", function () {
    if (furthest > 1) track("Read in browser", "reached page " + (furthest - 1) + " of " + (totalPages - 1), true);
  });
  function fallback() { pagesEl.hidden = true; document.getElementById("fallback").hidden = false; }
  if (!window.pdfjsLib) { fallback(); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  pdfjsLib.getDocument(PDF_URL).promise.then(function (pdf) {
    var total = totalPages = pdf.numPages;
    var figs = [];
    for (var i = 1; i <= total; i++) {
      var fig = document.createElement("figure");
      fig.className = "page"; fig.dataset.n = i;
      fig.setAttribute("aria-label", i === 1 ? "Title page" : "Page " + (i - 1));
      fig.innerHTML = '<div class="loading caps">' + (i === 1 ? "" : i - 1) + "</div>";
      pagesEl.appendChild(fig); figs.push(fig);
    }
    function render(fig) {
      if (fig.dataset.done) return; fig.dataset.done = "1";
      pdf.getPage(+fig.dataset.n).then(function (page) {
        var base = page.getViewport({ scale: 1 });
        fig.style.aspectRatio = base.width + " / " + base.height;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var vp = page.getViewport({ scale: (fig.clientWidth * dpr) / base.width });
        var c = document.createElement("canvas");
        c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
        return page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise.then(function () {
          fig.innerHTML = ""; fig.appendChild(c);
        });
      }).catch(function () { delete fig.dataset.done; });
    }
    if ("IntersectionObserver" in window) {
      var lazy = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) { render(e.target); lazy.unobserve(e.target); } });
      }, { rootMargin: "1200px 0px" });
      var reader = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) furthest = Math.max(furthest, +e.target.dataset.n); });
      }, { rootMargin: "-45% 0px -50% 0px" });
      figs.forEach(function (f) { lazy.observe(f); reader.observe(f); });
    } else {
      figs.forEach(render);
    }
  }).catch(fallback);
})();
</script>
</body>
</html>
